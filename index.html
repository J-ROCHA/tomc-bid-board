<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>TOMC Bid Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Live board: a read-only copy of the bid app's Calendar tab, refreshed every 90 seconds. */
:root{
  --bg:#eef2f6; --surface:#ffffff; --sunk:#e4e9f0; --ink:#152130; --muted:#5a6779; --line:#d3dae4;
  --accent:#1d5bb8; --accent-ink:#ffffff; --accent-soft:#dce7f8;
  --hol:#a8670f; --hol-soft:#f6e7cf; --mix:#6a4bb5; --mix-soft:#e7e0f6; --bad:#b83a26; --bad-soft:#f7dcd6;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace; --r:6px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e131a; --surface:#161d27; --sunk:#1d2632; --ink:#e5ebf3; --muted:#92a0b3; --line:#2a3544;
  --accent:#6ea2ff; --accent-ink:#0b1424; --accent-soft:#1c2c47;
  --hol:#e8a94e; --hol-soft:#3a2c16; --mix:#ad96f0; --mix-soft:#2c2545; --bad:#f08a76; --bad-soft:#3c1f1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131a; --surface:#161d27; --sunk:#1d2632; --ink:#e5ebf3; --muted:#92a0b3; --line:#2a3544;
  --accent:#6ea2ff; --accent-ink:#0b1424; --accent-soft:#1c2c47;
  --hol:#e8a94e; --hol-soft:#3a2c16; --mix:#ad96f0; --mix-soft:#2c2545; --bad:#f08a76; --bad-soft:#3c1f1a; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px}
h1{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.02em;margin:0;text-transform:uppercase}h1 span{color:var(--accent)}
h2{font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.05em;text-transform:uppercase;margin:0 0 6px}
.label{font-family:var(--f-display);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.upd{font-size:13px;color:var(--muted);text-align:right}.upd.stale{color:var(--bad);font-weight:600}
.clock{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px;margin:16px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.card b{display:block;font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1.1}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.05em;text-transform:uppercase;border:0;background:var(--surface);color:var(--muted);padding:7px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.yr{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:14px}
.mon{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;min-width:0}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.dow{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 3px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:4px;min-height:58px;padding:3px;display:flex;flex-direction:column;gap:2px;min-width:0}
.day.pad{background:transparent;border-color:transparent}.day.full{border-color:var(--bad)}
.dn{display:flex;justify-content:space-between;align-items:flex-start;gap:3px}.dn b{font-family:var(--f-mono);font-weight:500;font-size:12px}
.gauges{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.g{font-family:var(--f-mono);font-size:9.5px;line-height:1.35;padding:0 3px;border-radius:3px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.g.full{background:var(--bad);color:var(--surface)}.g.some{background:var(--accent-soft);color:var(--accent)}
.chip{font-size:10.5px;line-height:1.3;padding:0 3px;border-radius:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:2px solid currentColor}
.c-vac{background:var(--accent-soft);color:var(--accent)}.c-hol{background:var(--hol-soft);color:var(--hol)}.c-mix{background:var(--mix-soft);color:var(--mix)}
.chip span{color:var(--ink)}
.msg{padding:28px 16px;text-align:center;color:var(--muted)}
@media (max-width:640px){.day{min-height:40px}.day .chip{display:none}.dow{font-size:10px}}
</style>
</head>
<body>
<div class="wrap">
  <header><div><h1>TOMC <span>Bid Board</span></h1><div class="label" id="sub">Vacation bid · who is off each day</div></div><div class="upd" id="upd" role="status">Loading…</div></header>
  <main id="app"><div class="msg">Loading the board…</div></main>
</div>
<script>
(function(){
"use strict";
// board.json is written by the steward's bid app to the "data" branch of this repository after every award.
const owner=location.hostname.endsWith(".github.io")?location.hostname.split(".")[0]:"",repo=location.pathname.split("/").filter(Boolean)[0]||"";
const SRC=owner&&repo?`https://raw.githubusercontent.com/${owner}/${repo}/data/board.json`:"board.json";
const MONTH=["January","February","March","April","May","June","July","August","September","October","November","December"];
const DESK={a:"Airframe",e:"Engine"},K={vac:"Vacation",hol:"Holiday",mix:"Vacation + holiday"};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let data=null,desk=(()=>{try{return localStorage.getItem("board.desk")||"all"}catch(e){return"all"}})(),failed=false;
function render(){const app=document.getElementById("app"),upd=document.getElementById("upd");
  if(!data){app.innerHTML=`<div class="msg">${failed?"The board couldn't be loaded. It will try again shortly.":"Loading the board…"}</div>`;return}
  const y=data.year,cap=data.caps||{},u=new Date(data.updated),age=(Date.now()-u)/6e4;
  upd.className="upd"+(failed?" stale":"");
  upd.textContent=`Updated ${u.toLocaleString([],{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}`+(failed?" · can't reach the board right now":age>1?` · ${age<60?Math.round(age)+" min":Math.round(age/60)+" hr"} ago`:" · just now");
  document.getElementById("sub").textContent=`${y} vacation bid · who is off each day`;
  const cl=data.clock||{};
  let h=`<div class="clock">${["airframe","engine"].map(d=>`<div class="card"><span class="label">${d==="airframe"?"Airframe":"Engine"} · on the clock</span><b>${cl[d]?esc(cl[d].name):"Nobody right now"}</b>${cl[d]?`<span class="label">${esc(cl[d].round)}</span>`:""}</div>`).join("")}</div>`;
  h+=`<div class="bar"><div class="seg" role="group">${[["all","All"],["a","Airframe"],["e","Engine"]].map(([k,l])=>`<button data-d="${k}" aria-pressed="${desk===k}">${l}</button>`).join("")}</div>
    <div class="legend"><span><i class="sw" style="background:var(--accent)"></i>Vacation</span><span><i class="sw" style="background:var(--hol)"></i>Holiday</span><span><i class="sw" style="background:var(--mix)"></i>Vacation + holiday</span><span><span class="g full">AF ${cap.airframe}/${cap.airframe}</span> desk full</span><span>AF airframe · EN engine. Only work days are shown.</span></div></div><div class="yr">`;
  const g=(lbl,n,c)=>n?`<span class="g ${n>=c?"full":"some"}">${lbl} ${n}/${c}</span>`:"";
  for(let m=0;m<12;m++){const lead=new Date(Date.UTC(y,m,1)).getUTCDay(),dim=new Date(Date.UTC(y,m+1,0)).getUTCDate();
    h+=`<section class="mon" aria-label="${MONTH[m]} ${y}"><h2>${MONTH[m]}</h2><div class="cal">${["S","M","T","W","T","F","S"].map(d=>`<div class="dow">${d}</div>`).join("")}${'<div class="day pad" aria-hidden="true"></div>'.repeat(lead)}`;
    for(let d=1;d<=dim;d++){const key=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`,l=(data.days||{})[key]||[];
      const af=l.filter(x=>x[1]==="a").length,en=l.filter(x=>x[1]==="e").length,shown=l.filter(x=>desk==="all"||x[1]===desk);
      const full=(desk!=="e"&&af>=cap.airframe)||(desk!=="a"&&en>=cap.engine);
      const tip=`${MONTH[m]} ${d}: `+(shown.length?shown.map(x=>`${x[0]} (${DESK[x[1]]}, ${K[x[2]]||""})`).join("; "):"nobody off");
      h+=`<div class="day${full?" full":""}" title="${esc(tip)}"><div class="dn"><b>${d}</b><span class="gauges">${desk!=="e"?g("AF",af,cap.airframe):""}${desk!=="a"?g("EN",en,cap.engine):""}</span></div>${shown.map(x=>`<span class="chip c-${esc(x[2])}"><span>${esc(x[0])}</span></span>`).join("")}</div>`}
    h+=`</div></section>`}
  app.innerHTML=h+`</div>`}
// The latest commit on the data branch says which board.json is current; that exact file is never stale. raw.githubusercontent.com
// caches a branch file for up to 5 minutes, so it's only the fallback (for example when GitHub's 60 checks an hour per network run out).
let sha="";
async function latest(){if(!owner)return"";const r=await fetch(`https://api.github.com/repos/${owner}/${repo}/commits/data`,{cache:"no-cache",headers:{Accept:"application/vnd.github.sha"}});if(!r.ok)throw new Error(r.status);return(await r.text()).trim()}
async function load(){try{let s="";try{s=await latest()}catch(e){s=""}
    if(s&&s===sha&&data){failed=false;render();return}
    const url=s?`https://raw.githubusercontent.com/${owner}/${repo}/${s}/board.json`:SRC+(SRC.startsWith("http")?"?t="+Date.now():"");
    const r=await fetch(url,{cache:s?"default":"no-store"});if(!r.ok)throw new Error(r.status);data=await r.json();sha=s;failed=false}catch(e){failed=true}render()}
document.addEventListener("click",e=>{const b=e.target.closest("[data-d]");if(!b)return;desk=b.dataset.d;try{localStorage.setItem("board.desk",desk)}catch(_){}render()});
load();setInterval(load,90000);
})();
</script>
</body>
</html>
